name: Build & Deploy to Cloudflare Pages

on:
  # Auto-deploy when code is pushed to main
  push:
    branches: [main]

  # WordPress webhook trigger (fires on publish/update/delete)
  repository_dispatch:
    types: [wordpress_publish]

  # Manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build
        env:
          PUBLIC_WP_URL: https://admin.hrhelp.nl

      # NOTE: Production guides are now controlled at build time via
      # src/data/pseo/approved-guides.json (only client-approved guides are
      # generated on production; staging shows all). The old blanket
      # "rm -rf dist/guides" step was removed so approved guides stay live.

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=hrhelp-website --branch=production

      # Purge Cloudflare CDN cache so changes appear immediately
      - name: Purge Cloudflare Cache
        if: success()
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}' || echo "Cache purge skipped (zone ID not set)"
