name: Build & Deploy to Cloudflare Pages

on:
  # Auto-deploy when code is pushed to main
  push:
    branches: [main]

  # WordPress content. The WordPress plugin signals GitHub (repository_dispatch) so new posts go
  # live within minutes. Each signal only runs the quick check below and deploys when the
  # content really changed since the live build, so a plugin that signals far more often than
  # content changes (it currently fires about once a minute) no longer redeploys the site.
  repository_dispatch:
    types: [wordpress_publish]
  # Safety net when a signal is missed: the same check every 10 minutes. Minutes 7, 17, ... 57
  # keep clear of the top of the hour, when GitHub delays scheduled runs most.
  schedule:
    - cron: '7-59/10 * * * *'

  # Manual trigger from GitHub Actions UI: deploys when WordPress changed, or always with "force"
  workflow_dispatch:
    inputs:
      force:
        description: Deploy even if WordPress content has not changed
        type: boolean
        default: false

# One production deploy at a time. A run that will deploy (push, forced manual run) cancels
# an older run still in progress, so the newest code and content win and an older run never
# finishes last. A run that first checks WordPress (WordPress signal, schedule, manual run
# without force) never cancels a deploy in progress: it waits for it, then compares WordPress
# with what it published.
concurrency:
  group: deploy-production
  cancel-in-progress: ${{ github.event_name == 'push' || inputs.force == true }}

jobs:
  detect:
    if: github.event_name == 'repository_dispatch' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.force)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.check.outputs.changed }}

    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compare WordPress with the live build-info.json
        id: check
        run: node scripts/wp-changed.mjs
        env:
          PUBLIC_WP_URL: https://admin.hrhelp.nl
          # Signal and scheduled runs build main's newest commit: also deploy when the live build
          # is another one (a push deploy that was cancelled while pending, or failed).
          EXPECTED_COMMIT: ${{ (github.event_name == 'schedule' || github.event_name == 'repository_dispatch') && github.sha || '' }}

  deploy:
    needs: detect
    # detect is skipped on push and on a forced manual run; !cancelled() stops deploy from
    # being skipped along with it (always() would also start it in a cancelled run).
    if: >-
      !cancelled() &&
      (github.event_name == 'push' || inputs.force == true ||
      (needs.detect.result == 'success' && needs.detect.outputs.changed == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build
        env:
          PUBLIC_WP_URL: https://admin.hrhelp.nl

      # NOTE: Production guides are now controlled at build time via
      # src/data/pseo/approved-guides.json (only client-approved guides are
      # generated on production; staging shows all). The old blanket
      # "rm -rf dist/guides" step was removed so approved guides stay live.

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=hrhelp-website --branch=production

      # Purge Cloudflare CDN cache so changes appear immediately
      - name: Purge Cloudflare Cache
        if: success()
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}' || echo "Cache purge skipped (zone ID not set)"
